<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .drift-a { animation: driftA 14s ease-in-out infinite alternate; }
    .drift-b { animation: driftB 18s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0,0) } to { transform: translate(-60px,40px) } }
    @keyframes driftB { from { transform: translate(0,0) } to { transform: translate(70px,-30px) } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <defs>
    <clipPath id="card"><rect width="1000" height="420" rx="24"/></clipPath>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity=".35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset=".5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.75" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1000" height="420" fill="url(#gridFade)"/></mask>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="420" fill="#09090B"/>
    <rect width="1000" height="420" fill="url(#grid)" mask="url(#gridMask)"/>
    <g class="drift-a"><circle cx="860" cy="40" r="360" fill="url(#glowA)"/></g>
    <g class="drift-b"><circle cx="120" cy="440" r="300" fill="url(#glowB)"/></g>
  </g>
  <rect x=".5" y=".5" width="999" height="419" rx="23.5" stroke="#FFFFFF" stroke-opacity=".09"/>

  <!-- eyebrow -->
  <rect x="64" y="76" width="28" height="2" rx="1" fill="url(#accent)"/>
  <text x="104" y="82" class="mono" font-size="13" letter-spacing="3" fill="#A1A1AA">LEAD SOFTWARE ENGINEER</text>

  <!-- name -->
  <text x="60" y="176" class="sans" font-size="76" font-weight="700" letter-spacing="-2.5" fill="#FAFAFA">Sañyam Kumar</text>

  <!-- tagline -->
  <text x="64" y="230" class="sans" font-size="22" fill="#A1A1AA">I design and build scalable backend &amp; data platforms,</text>
  <text x="64" y="262" class="sans" font-size="22" fill="#A1A1AA">and own them from concept to production<tspan class="blink" fill="#C084FC">_</tspan></text>

  <!-- stack -->
  <g class="mono" font-size="14" fill="#E4E4E7">
    <g transform="translate(64 318)">
      <rect width="104" height="36" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#5FA04E"/><text x="32" y="23">Node.js</text>
    </g>
    <g transform="translate(180 318)">
      <rect width="74" height="36" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#38BDF8"/><text x="32" y="23">SQL</text>
    </g>
    <g transform="translate(266 318)">
      <rect width="90" height="36" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#DC322F"/><text x="32" y="23">Scala</text>
    </g>
    <g transform="translate(368 318)">
      <rect width="130" height="36" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#FF3621"/><text x="32" y="23">Databricks</text>
    </g>
    <g transform="translate(510 318)">
      <rect width="148" height="36" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#A855F7"/><text x="32" y="23">ETL pipelines</text>
    </g>
  </g>
</svg>
